name: Bug report
description: Report a reproducible problem in BedrockNexus Plugins.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, private keys, private repository details, or personal data.
        Security vulnerabilities must be reported privately according to SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest repeatable sequence of steps.
      placeholder: |
        1. Sign in with a test account
        2. Open ...
        3. Select ...
        4. Observe ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or deployment
      description: Commit SHA, branch, or deployment URL where this occurred.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Bun/Node versions, and relevant non-secret configuration.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove secrets, tokens, personal data, and private repository names.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: This is not a security vulnerability.
          required: true
